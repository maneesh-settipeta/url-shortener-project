spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: false

app:
  shortener:
    base-url: http://localhost:8080
    code-length: 7
    max-generation-attempts: 8
    default-ttl: 30d
    max-ttl: 365d
    create-requests-per-minute: 1000
